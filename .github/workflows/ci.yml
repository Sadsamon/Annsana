name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: annsana_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install pytest pytest-django || true
      - name: Run migrations
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/annsana_test
          DJANGO_SETTINGS_MODULE: config.settings.testing
        run: |
          python manage.py migrate || true
      - name: Run tests
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/annsana_test
          DJANGO_SETTINGS_MODULE: config.settings.testing
        run: |
          # Run pytest but treat "no tests collected" (exit code 5) as success so CI doesn't fail on empty test suites.
          pytest -q || {
            ec=$?
            if [ "$ec" -eq 5 ]; then
              echo "No tests collected. Continuing without failing the workflow."
              exit 0
            else
              echo "pytest failed with exit code $ec"
              exit $ec
            fi
          }
