{% extends "base.html" %}

{% block title %}Feed · Annsana{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto">
    <div class="mb-6 flex items-center justify-between">
        <h1 class="font-display text-2xl text-indigo-700">Feed</h1>
        {% if user.is_authenticated %}
            <a href="{% url 'feed:create' %}"
               class="rounded-md bg-terracotta-500 px-4 py-2 text-sm text-white">
                New post
            </a>
        {% endif %}
    </div>

    <div id="post-list">
        {% include "feed/partials/post_list.html" %}
    </div>
</div>
{% endblock %}
