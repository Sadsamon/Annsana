{% for post in posts %}
    {% include "feed/partials/post_card.html" %}
{% endfor %}

{% if page_obj.has_next %}
    <div hx-get="{% url 'feed:list' %}?page={{ page_obj.next_page_number }}"
         hx-trigger="revealed"
         hx-swap="outerHTML"
         class="py-4 text-center text-sm text-neutral-600">
        Loading more…
    </div>
{% endif %}
