{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Annsana{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/tokens.css' %}">
    <link rel="stylesheet" href="{% static 'css/output.css' %}">
    <script src="https://unpkg.com/htmx.org@1.9.10" defer></script>
</head>
<body class="bg-neutral-50 font-body text-neutral-900"
    hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
    <header class="border-b border-neutral-300 px-6 py-4">
        <a href="{% url 'feed:list' %}" class="font-display text-xl text-indigo-700">Annsana</a>
    </header>

    <main class="px-6 py-8">
        {% if messages %}
            <ul class="mb-6 space-y-2">
                {% for message in messages %}
                    <li class="rounded-md bg-gold-50 px-4 py-2 text-sm">{{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
